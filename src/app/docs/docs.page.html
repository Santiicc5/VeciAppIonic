<ion-header class="header-blue">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab1" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Documentos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="page">
  <div class="section">
    <h2>Carpetas</h2>

    <div class="chips">
      <button class="chip" *ngFor="let f of folders">
        {{ f.name }}
      </button>
    </div>
  </div>

  <div class="section">
    <h2>Actas digitales</h2>

    <div class="doclist">
      <div class="doc" *ngFor="let d of actas">
        <div class="doc-text" [class.two-line]="d.chevron">{{ d.title }}</div>
        <ion-icon *ngIf="d.chevron" name="chevron-forward" class="doc-chev"></ion-icon>
      </div>
    </div>
  </div>
</ion-content>
