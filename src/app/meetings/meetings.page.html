<ion-header class="header-blue">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab1" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Juntas y votaciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="page">
  <div class="section">
    <h2>Convocatoria</h2>
    <p class="big">{{ convocatoria }}</p>
  </div>

  <div class="section">
    <h2>Votación activa</h2>
    <p class="question">{{ question }}</p>

    <div class="vote-card"
         *ngFor="let o of options"
         [class.active]="o.id === selectedId"
         (click)="select(o.id)">
      <div class="left">
        <div class="num">{{ o.id }}</div>
        <div class="opt">{{ o.label }}</div>
      </div>
      <div class="right">Votos: {{ o.votes }}</div>
    </div>
  </div>

  <div class="section">
    <h2>Votaciones anteriores</h2>

    <div class="previous">
      <div *ngFor="let a of anteriores" class="prev-row">
        <div class="prev-title">{{ a.title }}</div>
        <div class="prev-res">Resolución: <b>{{ a.result }}</b></div>
      </div>
    </div>
  </div>
</ion-content>
