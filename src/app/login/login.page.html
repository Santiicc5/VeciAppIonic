<ion-content class="login-bg">
  <div class="wrap">

    <img src="assets/icon/logo.png" class="logo" alt="VeciApp" />

    <h1 class="title">VeciApp</h1>
    <p class="subtitle">Gestión de tu comunidad</p>

    <div class="form">

      <div class="input">
        <ion-icon name="person-outline"></ion-icon>
        <ion-input placeholder="Usuario"></ion-input>
      </div>

      <div class="input">
        <ion-icon name="lock-closed-outline"></ion-icon>
        <ion-input type="password" placeholder="Contraseña"></ion-input>
      </div>

      <ion-button class="btn" expand="block" routerLink="/tabs">
        Iniciar sesión
      </ion-button>

      <div class="forgot">¿Olvidaste tu contraseña?</div>

    </div>

  </div>
</ion-content>
