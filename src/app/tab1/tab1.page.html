<ion-header>
  <ion-toolbar class="home-toolbar">
    <ion-title>
      <div class="t1-title">VeciApp</div>
      <div class="t1-subtitle">Gestión de tu comunidad</div>
    </ion-title>

    <ion-buttons slot="end">
      <ion-button class="notif-btn">
        <i class="fa-regular fa-bell"></i>
        <span class="notif-dot">1</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="home-content">
  <div class="page">

    <div class="section-head">
      <i class="fa-solid fa-triangle-exclamation alert-fa"></i>
      <span>Alerta</span>
    </div>

    <!-- ✅ Fuga (cabecera + cuerpo) -->
    <div class="card">
      <div class="card-head">
        <div class="iconpill red">
          <i class="fa-solid fa-droplet"></i>
        </div>
        <div class="card-title">Fuga de agua</div>
      </div>

      <div class="card-body">
        <div class="card-sub">Revisar departamento 302</div>
      </div>
    </div>

    <!-- ✅ Mensualidad (cabecera + cuerpo) -->
    <div class="card">
      <div class="card-head">
        <div class="iconpill green">
          <i class="fa-solid fa-euro-sign"></i>
        </div>
        <div class="card-title">Mensualidad</div>
      </div>

      <div class="card-body">
        <div class="line">
          <span class="k">Estado:</span>
          <span class="pill">Pendiente</span>
        </div>

        <div class="line">
          <span class="k">Monto:</span>
          <span class="v">$800</span>
        </div>
      </div>
    </div>

    <!-- ✅ Actas digitales (cabecera + cuerpo) -->
    <div class="card">
      <div class="card-head">
        <div class="iconpill blue">
          <i class="fa-solid fa-file-lines"></i>
        </div>
        <div class="card-title">Actas digitales</div>
      </div>

      <div class="card-body">
        <ul class="bullets">
          <li>Acta Junta Ordinaria 15/03/2024</li>
          <li>Acta Junta Ordinaria 20/03/2023</li>
        </ul>
      </div>
    </div>

    <div class="section-head plain">
      <span>Accesos rápidos</span>
    </div>

    <div class="quick quick-fill">
      <div class="quick-item" (click)="go('/docs')">
        <div class="quick-ico">
          <i class="fa-solid fa-folder-open"></i>
        </div>
        <div class="quick-t">Docs</div>
      </div>

      <div class="quick-item" (click)="go('/mantenimiento')">
        <div class="quick-ico">
          <i class="fa-solid fa-screwdriver-wrench"></i>
        </div>
        <div class="quick-t">Incidencias</div>
      </div>

      <div class="quick-item" (click)="go('/meetings')">
        <div class="quick-ico">
          <i class="fa-solid fa-users"></i>
        </div>
        <div class="quick-t">Juntas</div>
        <ion-icon name="chevron-forward" class="quick-chev"></ion-icon>
      </div>
    </div>

  </div>
</ion-content>
